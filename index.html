        min-height: 100%;
        background: #fff;
        color: #000;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        display: grid;
        gap: 0.75rem;
        justify-items: center;
        padding: 1rem;
      }

      p {
        margin: 0;
        font-size: 2rem;
        line-height: 1.5;
      }

      .social-links {
        display: flex;
        gap: 0.75rem;
        align-items: center;
      }

      .social-links a {
        display: inline-grid;
        width: 2.25rem;
        height: 2.25rem;
        place-items: center;
        color: inherit;
        border: 1px solid #d4d4d4;
        border-radius: 0.5rem;
        transition:
          border-color 160ms ease,
          transform 160ms ease;
      }

      .social-links a:hover {
        border-color: #000;
        transform: translateY(-1px);
      }

      .social-links svg {
        width: 1.25rem;
        height: 1.25rem;
        fill: currentColor;
      }

      .story-line {
        margin: 0;
        font-size: 0.63rem;
        line-height: 1.4;
        text-align: center;
      }

      .story-line a {
        color: inherit;
        text-decoration: underline;
        text-underline-offset: 0.16em;
      }
    </style>
