<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#000000">
  <meta name="msapplication-TileColor" content="#000000">
  <title>kanishk's webpage</title>
  <style>
    @font-face {
      font-family: "Berkeley Mono";
      src: url("/fonts/BerkeleyMono-Bold.otf") format("opentype");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    :root {
      color-scheme: only dark;
      --black: #000000;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100vh;
      padding: 7rem 0 0 2.25rem;
      background: var(--black);
      color: var(--white);
      display: grid;
      place-items: start;
      font-family: "Berkeley Mono", monospace;
      font-weight: 700;
    }

    .hero {
      position: relative;
      width: max-content;
    }

    h1 {
      margin: 0.2rem 0 0 0.25rem;
      font-size: clamp(1.6rem, 6.4vw, 4.8rem);
      line-height: 1.05;
      text-align: center;
      text-decoration: underline;
      text-decoration-thickness: 0.08em;
      text-underline-offset: 0.14em;
    }

    .media {
      position: absolute;
      top: calc(100% + 5.3125rem);
      right: 0.5rem;
      width: 68.2%;
    }

    .media img {
      width: 100%;
      height: auto;
      display: block;
      clip-path: inset(0 10% 0 17%);
    }

    .caption {
      position: absolute;
      left: calc(100% + 1.5rem);
      top: 0.4rem;
      margin: 0;
      width: 27ch;
      max-width: none;
      color: var(--white);
      font-size: clamp(1rem, 1.6vw, 1.5rem);
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main class="hero">
    <h1>Hi, I'm Kanishk</h1>
    <div class="media">
      <img src="./images/IMG_0537%202.jpg" alt="Kanishk holding an ID badge in a store">
      <p class="caption">This is me @ NYU, a few hours after I landed in the US for the first time in August 2023.</p>
    </div>
  </main>
</body>
</html>
